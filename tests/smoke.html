<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Module Studio — Smoke tests</title>
  <style>
    body { font: 14px/1.5 Inter, system-ui, sans-serif; margin: 24px; color: #282a36; background: #f7f7fa; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    p { margin: 0 0 16px; color: #63657b; }
    button { font: inherit; padding: 6px 14px; border-radius: 99px; border: 1px solid #282a36; background: #fff; cursor: pointer; }
    #summary { margin: 16px 0; font-weight: 600; }
    table { border-collapse: collapse; width: 100%; max-width: 860px; background: #fff; }
    td, th { text-align: left; padding: 8px 12px; border-bottom: 1px solid #e1e2eb; vertical-align: top; }
    .pass { color: #0a7a3d; font-weight: 600; }
    .fail { color: #c0262d; font-weight: 600; }
    iframe { position: absolute; left: -9999px; top: 0; width: 1280px; height: 900px; border: 0; }
  </style>
</head>
<body>
  <h1>Module Studio — Smoke tests</h1>
  <p>Open this page through a web server (<code>python3 -m http.server</code>, then <code>/tests/smoke.html</code>). Run it after every change, together with <code>python3 build-pro.py</code>.</p>
  <button id="run" type="button">Run again</button>
  <div id="summary">Running…</div>
  <table><thead><tr><th>Test</th><th>Result</th><th>Detail</th><th>Time</th></tr></thead><tbody id="results"></tbody></table>
  <iframe id="app" title="Module Studio" src="../index.html"></iframe>

<script>
(() => {
  const frame = document.getElementById("app");
  const tbody = document.getElementById("results");
  const summary = document.getElementById("summary");
  const SHAPES = ["circle","square","triangle","line","cross","ring","semicircle","quarter","crescent","wave","spiral","arrow","pentagon","hexagon","octagon","star","letterA","letterS","letterR","digit1","digit5","digit9"];

  const wait = (ms) => new Promise(r => setTimeout(r, ms));

  async function waitForApp() {
    for (let i = 0; i < 100; i++) {
      try { if (frame.contentWindow.studioProApp) return frame.contentWindow; } catch (e) { throw new Error("Cannot reach the app: serve this page over http (not file://)."); }
      await wait(100);
    }
    throw new Error("The app did not start.");
  }

  // Deterministic random numbers so a failure can be reproduced.
  function makeRng(seed) {
    let s = seed;
    const rnd = () => { s = (s * 1664525 + 1013904223) % 4294967296; return s / 4294967296; };
    return { rnd, pick: (a) => a[Math.floor(rnd() * a.length)], ri: (a, b) => Math.floor(a + rnd() * (b - a + 1)), rb: () => rnd() < 0.5 };
  }

  function randomizeState(app, r) {
    const { rnd, pick, ri, rb } = r;
    const s = app.state;
    s.aspectRatio = pick(["1:1", "9:16", "4:3", "3:4", "16:9"]);
    s.invertFigureGround = rb(); s.showSafeBounds = rb();
    const target = ri(1, 5);
    while (s.layers.length < target) {
      const L = JSON.parse(JSON.stringify(s.layers[0])); const id = "layer-" + (s.layers.length + 1);
      L.id = id; L.name = "Layer " + (s.layers.length + 1); s.layers.push(L); s.layerOrder.unshift(id);
    }
    while (s.layers.length > target) { const L = s.layers.pop(); s.layerOrder = s.layerOrder.filter(x => x !== L.id); }
    for (const L of s.layers) {
      L.shape = pick(SHAPES); L.width = ri(5, 400); L.height = ri(5, 250); L.rotation = ri(0, 360);
      L.offsetX = ri(-250, 250); L.offsetY = ri(-250, 250); L.wireframe = rb(); L.strokeWidth = ri(1, 10) / 2; L.visible = rnd() < 0.9;
      const st = L.structure; st.enabled = rnd() < 0.8; st.mode = pick(["repetition", "radiation"]);
      const rp = st.repetition; rp.gridType = pick(["basic","sliding","sheared","curved","zigzag","triangular","alternating","hexagonal","free"]); rp.freeSeed = ri(1, 99); rp.lineColor = pick(["","#cc2222","#ffffff"]); rp.lineDirection = pick(["both","horizontal","vertical"]); rp.lineSpacing = pick(["all","alternate"]); rp.reflection = pick(["none","columns","rows","both"]);
      rp.cols = ri(1, 50); rp.rows = ri(1, 50); rp.spacing = ri(0, 40); rp.shearAngle = ri(0, 45); rp.slideOffset = rnd(); rp.curveAmount = Math.round(rnd() * 100) / 100;
      rp.activeClipping = rb(); rp.showGridLines = rb(); rp.checkerInvert = rb(); rp.direction = pick(["repeated","alternated","undefined"]);
      const rd = st.radiation; rd.scheme = pick(["centrifugal","centripetal","concentric","spiral","multi_center"]); rd.orientation = pick(["auto","outward","inward","tangent","fixed"]); rd.centerOpen = ri(0, 70); rd.ringRotation = ri(-90, 90); rd.rays = ri(4, 28); rd.rings = ri(2, 10);
      rd.spiralTwist = ri(-180, 180); rd.centerX = ri(-200, 200); rd.centerY = ri(-200, 200); rd.showRays = rb(); rd.showRings = rb(); rd.activeClipping = rb(); rd.direction = pick(["repeated","alternated","undefined"]); rd.lineColor = pick(["","#2244cc"]); rd.ringShape = pick(["circle","triangle","square","hexagon"]); rd.centerCount = ri(2, 6); rd.lineWidth = ri(1, 12) / 2;
      const fs = st.formalStructure; fs.enabled = rnd() < 0.4; fs.colRatio = 1 + rnd() * 2; fs.rowRatio = 1 + rnd() * 2; fs.showGridLines = rb();
      const sm = st.similarity; sm.enabled = rb(); sm.kinshipType = pick(["distortion","foreshortening","rotation_wobble","scale_kinship","hybrid"]); sm.intensity = ri(0, 100); sm.cellJitter = ri(0, 30); sm.association = pick(["none","round","angular","lines","characters"]); sm.assocMix = ri(0, 100); sm.imperfection = pick(["none","cut","broken"]); sm.imperfAmount = ri(0, 100);
      const g = st.gradation; g.enabled = rb(); g.type = pick(["rotation","scale","depth","drift","shape","texture","color"]); g.pathway = pick(["diagonal","horizontal","vertical","concentric","zigzag"]); g.range = ri(15, 360); g.steps = ri(1, 10); g.reverse = rb();
      g.sequence = pick(["restart","pingpong"]); g.easing = ri(-100, 100); g.alternate = rb(); g.targetShape = pick(SHAPES);
      const an = st.anomaly; an.enabled = rb(); an.type = pick(["focal","fracture","swell","tear","regrid"]); an.zoneGrid = pick(["sliding","sheared","curved","zigzag","triangular","alternating"]); an.epicenterX = 0.1 + rnd() * 0.8; an.epicenterY = 0.1 + rnd() * 0.8; an.radius = ri(50, 350); an.intensity = ri(10, 100); an.anomalousShape = pick(SHAPES); an.highlightColor = rb(); an.showReticle = rb(); an.distribution = pick(["single","regular","random"]); an.count = ri(2, 12); an.seed = ri(1, 99); an.attrs = { shape: rb(), scale: rb(), rotation: rb(), position: rb() };
      const co = st.contrast; co.enabled = rb(); co.dimension = pick(["scale","shape","direction","position","tone","texture","space"]); co.positionShift = ri(5, 50); co.positionAngle = ri(0, 360); co.dominanceRatio = ri(50, 95); co.scaleFactor = 0.2 + rnd() * 2.8; co.contrastShape = pick(SHAPES); co.angle = ri(15, 90); co.highlightContrast = rb(); co.spread = pick(["scattered","balanced","edge","center"]);
      const cn = st.concentration; cn.enabled = rb(); cn.mode = pick(["point","void","line","line_void","free","dense","sparse"]); cn.method = pick(["move","absence"]); cn.edgeFade = rb(); cn.attractorX = 0.05 + rnd() * 0.9; cn.attractorY = 0.05 + rnd() * 0.9; cn.power = ri(20, 100); cn.radius = ri(80, 450); cn.lineAxis = pick(["horizontal","vertical"]); cn.alignToField = rb(); cn.densityScale = rb(); cn.showAttractor = rb(); cn.focusCount = ri(2, 6);
      const tx = st.texture; tx.enabled = rb(); tx.jitter = ri(0, 10); tx.skipChance = ri(0, 90); tx.crossing = ri(0, 100); tx.undulation = ri(0, 30); tx.waves = ri(1, 6); tx.waveAngle = ri(0, 360); tx.hairOpacity = ri(10, 100);
      const sp = st.space; sp.enabled = rb(); sp.mode = pick(["isometric","foreshortening","fluctuating","conflicting"]); sp.depthPct = ri(5, 100); sp.angle = ri(-180, 180); sp.shading = ri(5, 100); sp.showIsoGuides = rb();
    }
  }

  // Draws directly through the engine so exceptions are visible to the test (app.render() catches them).
  function drawRaw(app) {
    app.engine.state = app.state;
    app.applyAspectRatio(app.state.aspectRatio || "1:1");
    app.engine.render(app.getActivePalette());
  }

  function inkPixels(win) {
    const cv = win.document.getElementById("studio-canvas");
    const d = cv.getContext("2d").getImageData(0, 0, cv.width, cv.height).data;
    let n = 0; for (let i = 0; i < d.length; i += 4) if (d[i] < 150 && d[i + 1] < 150 && d[i + 2] < 150) n++;
    return n;
  }

  let running = false; // two overlapping runs would share the app state and corrupt each other

  async function runAll() {
    if (running) return;
    running = true;
    try { await runAllInner(); } finally { running = false; }
  }

  async function runAllInner() {
    tbody.innerHTML = ""; summary.textContent = "Running…";
    window.__smokeResult = null;
    const win = await waitForApp();
    await wait(300);
    const app = win.studioProApp;
    const initial = JSON.stringify(app.state);
    // Older tests were written when Repetition modules shrank with their cell; the Base size default has its own test (reset(true))
    const reset = (keepDefaults = false) => { app.state = JSON.parse(initial); if (!keepDefaults) app.state.layers.forEach(l => { l.structure.repetition.moduleScale = "cell"; }); app.activeLayerId = app.state.layers[0].id; app.engine.state = app.state; app.figEdit = null; app.engine.viewState = null; if (app._editorCanvasKey) { app._editorCanvasKey = ""; app.engine.renderScale = 1; app.fitArtboard(); app.render(); } app.syncEditShell(); if (app.isFlyoutOpen) { app.isFlyoutOpen = false; app.updateRailUI(); } };
    const results = [];
    const record = (name, ok, detail = "", ms) => {
      results.push({ name, ok, detail });
      const tr = document.createElement("tr");
      tr.innerHTML = `<td>${name}</td><td class="${ok ? "pass" : "fail"}">${ok ? "PASS" : "FAIL"}</td><td>${detail}</td><td class="ms">${ms === undefined ? "" : Math.round(ms) + " ms"}</td>`;
      tbody.appendChild(tr);
    };
    const test = async (name, fn) => {
      const t0 = performance.now();
      try { const detail = await fn(); record(name, true, detail || "", performance.now() - t0); }
      catch (e) { record(name, false, e && e.message ? e.message : String(e), performance.now() - t0); }
      finally { reset(); }
    };
    const assert = (cond, msg) => { if (!cond) throw new Error(msg); };

    // Count save/restore calls inside the app window.
    const proto = win.CanvasRenderingContext2D.prototype;
    let saves = 0, restores = 0;
    if (!proto.__smokeWrapped) {
      const oS = proto.save, oR = proto.restore;
      proto.save = function () { saves++; return oS.apply(this, arguments); };
      proto.restore = function () { restores++; return oR.apply(this, arguments); };
      proto.__smokeWrapped = true;
    }

    await test("App starts and draws the default composition", () => {
      drawRaw(app);
      const ink = inkPixels(win);
      assert(ink > 100, `Canvas looks empty (${ink} dark pixels)`);
      return `${ink} dark pixels`;
    });

    await test("The app opens with round values: one circle layer, 1 px stroke, no turn, 100 x 100, centred", () => {
      reset();
      assert(app.state.layers.length === 1, "It should open with one layer, got " + app.state.layers.length);
      const L = app.state.layers[0];
      assert(L.shape === "circle" && L.strokeWidth === 1 && L.rotation === 0 && L.width === 100 && L.height === 100 && L.offsetX === 0 && L.offsetY === 0 && L.wireframe === true, "The first layer is not the round default: " + JSON.stringify({ s: L.shape, w: L.strokeWidth, r: L.rotation, wd: L.width, h: L.height, x: L.offsetX, y: L.offsetY }));
      assert(app.activeLayerId === L.id, "The only layer should be the active one");
    });

    await test("All 22 shapes draw in stroke and fill mode", () => {
      for (const shape of SHAPES) for (const wire of [true, false]) {
        reset(); const L = app.state.layers[0]; L.shape = shape; L.wireframe = wire;
        drawRaw(app);
        assert(inkPixels(win) > 100, `${shape} (${wire ? "stroke" : "fill"}) drew nothing`);
      }
      return "44 combinations";
    });

    // The random combinations are a third of the whole run: 150 by default, 400 when the page is opened with ?full
    const RANDOM_RUNS = new URLSearchParams(location.search).has("full") ? 400 : 150;
    await test(`${RANDOM_RUNS} random combinations: no exception, balanced canvas state`, () => {
      reset();
      const r = makeRng(12345);
      let failures = [], unbalanced = 0, maxMs = 0, total = 0;
      for (let n = 0; n < RANDOM_RUNS; n++) {
        randomizeState(app, r);
        saves = restores = 0;
        const t0 = performance.now();
        try { drawRaw(app); } catch (e) { failures.push(`#${n}: ${e.message}`); continue; }
        const dt = performance.now() - t0; total += dt; maxMs = Math.max(maxMs, dt);
        if (saves !== restores) unbalanced++;
      }
      assert(failures.length === 0, `${failures.length} exceptions, first: ${failures[0]}`);
      assert(unbalanced === 0, `${unbalanced} renders left an unbalanced save/restore`);
      return `avg ${Math.round(total / RANDOM_RUNS)} ms, worst ${Math.round(maxMs)} ms`;
    });

    await test("Texture is deterministic (same settings, same picture)", () => {
      reset();
      const L = app.state.layers[0]; L.structure.enabled = true; L.structure.texture = { enabled: true, jitter: 4, skipChance: 20, crossing: 20, undulation: 12 };
      drawRaw(app); const a = win.document.getElementById("studio-canvas").toDataURL();
      drawRaw(app); const b = win.document.getElementById("studio-canvas").toDataURL();
      assert(a === b, "Two identical renders differ (texture flickers)");
    });

    await test("Texture: random lines add short strokes outside the outline, and the sliders show 0 to 100 %", () => {
      reset();
      const d0 = win.document, q = (sel) => d0.querySelector(sel);
      const fire = (el, v) => { el.value = v; el.dispatchEvent(new win.Event("input", { bubbles: true })); el.dispatchEvent(new win.Event("change", { bubbles: true })); };
      const cv = win.document.getElementById("studio-canvas");
      const L = app.state.layers[0]; Object.assign(L, { shape: "circle", wireframe: true, width: 300, height: 300 }); app.state.showSafeBounds = false;
      const ink = (crossing) => {
        L.structure.enabled = true; L.structure.texture = { enabled: true, jitter: 0, skipChance: 0, crossing, undulation: 0 };
        drawRaw(app); const d = cv.getContext("2d").getImageData(0, 0, cv.width, cv.height).data; let n = 0;
        for (let i = 0; i < d.length; i += 4) if (d[i] < 110) n++;
        return n;
      };
      const none = ink(0), some = ink(100);
      assert(some > none * 1.01, `Random lines should add ink (${none} -> ${some})`);
      q('[data-rail-tab="texture"]').click();
      L.structure.texture = { enabled: true, jitter: 4, skipChance: 20, crossing: 20, undulation: 15 };
      app.syncTextureInspectorWithActiveLayer();
      assert(q("#num-texture-jitter").value === "40%" && q("#num-texture-undulation").value === "50%", `Shown as ${q("#num-texture-jitter").value} / ${q("#num-texture-undulation").value}`);
      fire(q("#input-texture-jitter"), 100);
      assert(Math.abs(L.structure.texture.jitter - 10) < 1e-9, "100 % jitter should store 10 px");
      fire(q("#input-texture-hairopacity"), 40);
      assert(L.structure.texture.hairOpacity === 40 && q("#num-texture-hairopacity").value === "40%", "The Random lines opacity slider did not apply");
      // a fainter strand leaves less ink than a strong one
      const strokeInk = (opacity) => {
        L.structure.texture = { enabled: true, jitter: 0, skipChance: 0, crossing: 100, undulation: 0, hairOpacity: opacity };
        drawRaw(app); const d = cv.getContext("2d").getImageData(0, 0, cv.width, cv.height).data; let n = 0;
        for (let i = 0; i < d.length; i += 4) n += 255 - d[i];
        return n;
      };
      assert(strokeInk(100) > strokeInk(15), "A lower opacity should leave less ink")
      // hairs follow the skipped outline: with most of the line skipped, the strands add far less ink than with no skipping
      const hairInk = (skip) => { const f = (c) => { L.structure.texture = { enabled: true, jitter: 0, skipChance: skip, crossing: c, undulation: 0, hairOpacity: 100 }; drawRaw(app); const d = cv.getContext("2d").getImageData(0, 0, cv.width, cv.height).data; let n = 0; for (let i = 0; i < d.length; i += 4) n += 255 - d[i]; return n; }; return f(100) - f(0); };
      assert(hairInk(70) < hairInk(0) * 0.7, "Random lines should thin out together with Line skipping")
    });

    await test("Space: the front face stays in place whatever the angle; depth is a share of the module; old pixel projects convert", () => {
      reset();
      const cv = win.document.getElementById("studio-canvas");
      const L = app.state.layers[0]; Object.assign(L, { shape: "square", wireframe: false, width: 100, height: 100 }); app.state.showSafeBounds = false;
      L.structure.enabled = true; L.structure.mode = "repetition"; Object.assign(L.structure.repetition, { cols: 1, rows: 1, sizeMode: "fit" });
      const dpr = cv.width / 600;
      // The module is a 100 px square at the middle of the canvas: its centre must be ink at every angle (it is the front face)
      const frontOk = (angle, depthPct) => {
        L.structure.space = { enabled: true, mode: "isometric", depthPct, angle, shading: 50, showIsoGuides: false };
        drawRaw(app);
        const d = cv.getContext("2d").getImageData(0, 0, cv.width, cv.height).data;
        const at = (x, y) => d[(Math.round(y * dpr) * cv.width + Math.round(x * dpr)) * 4];
        // a corner of the front face (inside it) is the figure colour, and the far corner of the old position is not inked by the front
        return at(300 + 45, 300 + 45) < 100 && at(300 - 45, 300 - 45) < 100;
      };
      for (const a of [-170, -90, 0, 30, 90, 135, 180]) assert(frontOk(a, 40), `The front face moved at ${a} degrees`);
      // depth as a share of the module: 50 % of a 100 px square reaches 50 px from the front
      L.structure.space = { enabled: true, mode: "isometric", depthPct: 50, angle: 0, shading: 50, showIsoGuides: false };
      drawRaw(app);
      const d2 = cv.getContext("2d").getImageData(0, 0, cv.width, cv.height).data;
      const px = (x, y) => d2[(Math.round(y * dpr) * cv.width + Math.round(x * dpr)) * 4];
      assert(px(300 + 50 + 30, 300) < 230 && px(300 + 50 + 70, 300) > 230, "A depth of 50 % should reach about 50 px beyond the front face");
      // old files: pixels become percentages
      const saved = JSON.parse(JSON.stringify(app.state));
      saved.layers[0].structure.space = { enabled: true, mode: "isometric", depth: 17, angle: 30, shading: 50 };
      saved.layers[0].structure.repetition.curveIntensity = 36; saved.layers[0].structure.repetition.cols = 4; delete saved.layers[0].structure.repetition.curveAmount; delete saved.layers[0].structure.radiation.moduleScale; delete saved.layers[0].structure.repetition.moduleScale;
      app.loadProjectText(JSON.stringify(saved));
      assert(app.state.layers[0].structure.space.depthPct === 20, `17 px should open as 20 % (got ${app.state.layers[0].structure.space.depthPct})`);
      assert(Math.abs(app.state.layers[0].structure.repetition.curveAmount - 0.24) < 1e-9, `36 px of wave on 150 px cells is 24 % (got ${app.state.layers[0].structure.repetition.curveAmount})`);
      assert(app.state.layers[0].structure.radiation.moduleScale === "cell", "A project saved before Module scale opens with Shrink with cell, so it does not change");
      assert(app.state.layers[0].structure.repetition.moduleScale === "cell", "The same for Repetition");
    });

    await test("Random lines also grow on filled shapes, in the figure colour", () => {
      reset();
      const cv = win.document.getElementById("studio-canvas");
      const L = app.state.layers[0]; Object.assign(L, { shape: "circle", wireframe: false, width: 200, height: 200, showContainer: false }); app.state.showSafeBounds = false;
      L.structure.enabled = true; L.structure.mode = "repetition"; Object.assign(L.structure.repetition, { cols: 1, rows: 1, sizeMode: "fit" });
      const dpr = cv.width / 600;
      const outside = (crossing, space) => {
        L.structure.texture = { enabled: true, jitter: 0, skipChance: 0, crossing, undulation: 0 };
        L.structure.space = { enabled: !!space, mode: "isometric", depthPct: 20, angle: 30, shading: 50, showIsoGuides: false };
        drawRaw(app);
        const d = cv.getContext("2d").getImageData(0, 0, cv.width, cv.height).data; let n = 0;
        for (let y = 0; y < cv.height; y += 2) for (let x = 0; x < cv.width; x += 2) {
          const r = Math.hypot(x / dpr - 300, y / dpr - 300);
          if (r > 103 && r < 150 && d[(y * cv.width + x) * 4] < 150) n++;
        }
        return n;
      };
      const bare = outside(0, false), hairy = outside(100, false);
      assert(bare === 0 && hairy > 15, `A filled circle should grow strands outside its edge (${bare} -> ${hairy})`);
    });

    await test("Checkerboard inversion also works in a radial layout: alternate sectors swap figure and ground", () => {
      reset();
      const cv = win.document.getElementById("studio-canvas");
      const L = app.state.layers[0]; Object.assign(L, { shape: "circle", wireframe: false, width: 10, height: 10, showContainer: false }); app.state.showSafeBounds = false;
      const st = L.structure; st.enabled = true; st.mode = "radiation"; Object.assign(st.radiation, { scheme: "concentric", rays: 8, rings: 2, centerOpen: 0, sizeMode: "fit", showRays: false, showRings: false, ringRotation: 0 });
      const dpr = cv.width / 600;
      const tone = (j) => { const a = ((j + 0.5) / 8) * Math.PI * 2, i = Math.round((300 + 100 * Math.cos(a)) * dpr), k = Math.round((300 + 100 * Math.sin(a)) * dpr); return cv.getContext("2d").getImageData(i, k, 1, 1).data[0]; };
      st.radiation.checkerInvert = false; drawRaw(app);
      const plain = [tone(0), tone(1), tone(2)];
      assert(plain.every(v => v > 200), `Without it every sector is plain ground (${plain})`);
      st.radiation.checkerInvert = true; drawRaw(app);
      const t = [tone(0), tone(1), tone(2), tone(3)];
      assert(Math.abs(t[0] - t[1]) > 150 && Math.abs(t[0] - t[2]) < 40 && Math.abs(t[1] - t[3]) < 40, `Alternate sectors should swap figure and ground (${t})`);
    });

    await test("Radial Fit: Module size 'Base size' (default) keeps every module at one size taken from the whole structure, 'Shrink with cell' shrinks it with the cell", async () => {
      reset();
      const d = win.document, cv = d.getElementById("studio-canvas");
      const L = app.state.layers[0]; Object.assign(L, { shape: "square", wireframe: false, width: 60, height: 60, showContainer: false }); app.state.showSafeBounds = false;
      const st = L.structure; st.enabled = true; st.mode = "radiation"; Object.assign(st.radiation, { scheme: "concentric", rays: 12, rings: 6, centerOpen: 0, sizeMode: "fit", showRays: false, showRings: false });
      assert(st.radiation.moduleScale === "uniform", "Base size is the default");
      st.radiation.moduleScale = "cell";
      const dpr = cv.width / 600;
      const inkInside = (r) => { drawRaw(app); const ctx = cv.getContext("2d"); const w = Math.round(2 * r * dpr); const data = ctx.getImageData(Math.round((300 - r) * dpr), Math.round((300 - r) * dpr), w, w).data; let n = 0; for (let i = 0; i < data.length; i += 4) if (data[i] < 128) n++; return n / (dpr * dpr); };
      const shrink = inkInside(80);
      st.radiation.moduleScale = "uniform";
      const same = inkInside(80);

    await test("Contrast spread: balanced, toward the edges and toward the center", () => {
      const e = app.engine;

      const N = 16;
      const stats = (spread) => {
        let total = 0, outer = 0, inner = 0, quadrants = [0, 0, 0, 0];
        for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {

          if (d > 0.7) outer++; if (d < 0.5) inner++;

        }
        return { total, outer, inner, quadrants };
      };

      const edge = stats("edge"), center = stats("center");

    await test("Boolean operations (prototype): union, subtract, intersect and exclude give the right areas, merge shapes that share an edge, keep holes and fill right", async () => {
      const B = win.regionBoolean, area = win.regionArea;
      const circle = (cx, cy, r, n = 360) => Array.from({ length: n }, (_, i) => ({ x: cx + r * Math.cos((i / n) * Math.PI * 2), y: cy + r * Math.sin((i / n) * Math.PI * 2) }));
      const rect = (x0, y0, x1, y1) => [{ x: x0, y: y0 }, { x: x1, y: y0 }, { x: x1, y: y1 }, { x: x0, y: y1 }];

      // two circles of radius 50, 50 apart: the lens between them is 3070.9
      const A = [circle(0, 0, 50)], C = [circle(50, 0, 50)];
      const lens = 3070.9, one = Math.PI * 2500;
      assert(near(area(B("intersect", A, C)), lens), `Intersect: the lens (${area(B("intersect", A, C))})`);
      assert(near(area(B("union", A, C)), 2 * one - lens), `Union (${area(B("union", A, C))})`);
      assert(near(area(B("subtract", A, C)), one - lens), `Subtract (${area(B("subtract", A, C))})`);
      assert(near(area(B("xor", A, C)), 2 * one - 2 * lens), `Exclude (${area(B("xor", A, C))})`);
      assert(B("union", A, C).length === 1 && B("subtract", A, C).length === 1 && B("xor", A, C).length === 2, "Union and subtract are one piece; exclude is the two crescents");
      // the same square twice (every edge shared)
      const S = [rect(0, 0, 100, 100)];
      assert(near(area(B("union", S, S)), 10000) && near(area(B("intersect", S, S)), 10000) && B("subtract", S, S).length === 0 && B("xor", S, S).length === 0, "The same square twice: union and intersection are the square, subtract and exclude leave nothing");
      // two squares sharing an edge merge into one rectangle
      const U = B("union", S, [rect(100, 0, 200, 100)]);
      assert(U.length === 1 && near(area(U), 20000), `Squares that share an edge merge (${U.length} contour, ${area(U)})`);
      // one square touching a corner only
      { const K = B("union", S, [rect(100, 100, 200, 200)]); assert(K.length >= 1 && K.length <= 2 && near(area(K), 20000), `Squares that touch at a corner keep both (${K.length} contours, ${area(K)})`); }
      // a region with a hole: a square of 100 with a hole of 40; its right half
      const frame = [rect(-50, -50, 50, 50), rect(-20, -20, 20, 20)];
      assert(near(area(B("union", frame, [])), 8400), "A region with a hole keeps it");
      const half = B("intersect", frame, [rect(0, -100, 100, 100)]);
      assert(near(area(half), 4200), `Half of a framed square (${area(half)})`);
      // a hole made by subtracting a circle from a bigger one fills as a hole with the nonzero rule
      const ring = B("subtract", [circle(0, 0, 50)], [circle(0, 0, 20)]);
      assert(ring.length === 2 && near(area(ring), Math.PI * (2500 - 400)), `A circle minus a smaller one is a ring (${ring.length} contours, ${area(ring)})`);
      const c2 = win.document.createElement("canvas"); c2.width = 120; c2.height = 120;
      const g = c2.getContext("2d"); g.translate(60, 60); g.beginPath();
      for (const c of ring) { c.forEach((p, i) => (i ? g.lineTo(p.x, p.y) : g.moveTo(p.x, p.y))); g.closePath(); }
      g.fill();
      const at = (x, y) => g.getImageData(60 + x, 60 + y, 1, 1).data[3];
      assert(at(0, 0) === 0 && at(35, 0) > 200, "The ring is filled and its hole is empty (nonzero fill)");
      // a circle against an overlapping square, all four operations

      const total = area(B("union", A, SQ)), inter = area(B("intersect", A, SQ));

      // many points: it has to be fast

      // FILL: two circles of 100 px, centres at 275 and 325 (canvas), overlapping in the middle
      draw("none");
      assert(dark(240, 300) && dark(300, 312) && dark(360, 300), "Stacked: every part is filled");
      draw("union");
      assert(dark(240, 300) && dark(300, 312) && dark(360, 300) && !dark(300, 230), "Union: both circles and their overlap, as one");
      draw("subtract");
      assert(dark(240, 300) && !dark(300, 312) && !dark(360, 300), "Subtract: the first circle minus the second");
      draw("intersect");
      assert(!dark(240, 300) && dark(300, 312) && !dark(360, 300), "Intersect: only the overlap");
      draw("xor");
      assert(dark(240, 300) && !dark(300, 312) && dark(360, 300), "Exclude: everything but the overlap");
      // STROKE: the arc of the first circle that lies inside the second (at 325, 300) is drawn when stacked, not in a union
      L.wireframe = true;
      draw("none");
      assert(dark(325, 300) && dark(275, 250), "Stroke, stacked: both circles are drawn whole");
      draw("union");
      const unionInk = ink(); draw("none"); const stackedInk = ink();
      assert(unionInk < stackedInk * 0.85, `Stroke, union: only the outer outline (${unionInk} vs ${stackedInk})`);
      draw("union");
      assert(!dark(325, 300) && !dark(275, 300) && dark(225, 300) && dark(375, 300), "Stroke, union: the inner arcs are gone, the outer ones stay");
      draw("subtract");
      assert(dark(225, 300) && dark(275, 300) && !dark(325, 300), "Stroke, subtract: the crescent's outline (the second circle's arc inside the first stays, the first's inside the second goes)");
      draw("intersect");
      assert(dark(275, 300) && dark(325, 300) && !dark(225, 300) && !dark(375, 300), "Stroke, intersect: the outline of the lens only");
      // Texture and Space work on the combined shape (fill)
      L.wireframe = false; L.combine = "union";
      L.structure.texture = { enabled: true, jitter: 0, skipChance: 0, crossing: 0, undulation: 20, waves: 1, waveAngle: 0 }; drawRaw(app);
      assert(ink() > 3000, "Texture bends the combined shape");
      L.structure.texture = { enabled: false };
      L.structure.space = { enabled: true, mode: "isometric", depthPct: 30, angle: 90, shading: 0 }; drawRaw(app);
      assert(dark(300, 215) || dark(300, 225), "Space gives the combined shape depth");
      L.structure.space = { enabled: false };
      // The SVG draws one outline for the combined shape
      draw("union");
      const svg = win.StudioExporter.buildSVG(app.engine, cv, app.getActivePalette());
      assert(/<path/.test(svg), "The SVG has the combined outline");
      // A line stays a line, a combined shape is not made of it
      L.figures = [{ shape: "circle", width: 80, height: 80, x: 0, y: 0, rotation: 0 }, { shape: "line", width: 150, height: 10, x: 0, y: 0, rotation: 0 }];
      L.wireframe = true; L.strokeWidth = 6; draw("subtract");
      assert(dark(300, 260) && dark(240, 300) && dark(360, 300), "A line (no area) is drawn as it is, the circle is kept whole (stroke)");
      // THE EDITOR
      L.combine = "none"; L.figures = [{ shape: "circle", width: 100, height: 100, x: 0, y: 0, rotation: 0 }];
      app.isFlyoutOpen = false; app.updateRailUI();
      q('[data-rail-tab="module"]').click(); await wait(60);
      assert(q("#fig-combine-block").classList.contains("is-disabled"), "With one shape there is nothing to combine");
      q("#btn-fig-add").click(); await wait(30);
      assert(!q("#fig-combine-block").classList.contains("is-disabled") && !q("#fig-list").ownerDocument.querySelector("[data-fig-combine].active"), "With two shapes Combine appears, on None (no operation on)");
      q('[data-fig-combine="union"]').click(); await wait(30);
      assert(L.combine === "union" && q('[data-fig-combine="union"]').classList.contains("active"), "The chip sets the operation");
      assert(/Combine: Union/.test(d.getElementById("art-log-lines").textContent), "The Art log lists it");
      app.undo();
      assert(L.combine === "none", "Undo takes the combination back one step");
      app.redo(); assert(L.combine === "union", "Redo brings it back");
      q("#btn-fig-cancel").click(); await wait(60);
      assert(L.combine === "none" && L.figures.length === 1, "Cancel goes back to how it was");
      q('[data-rail-tab="module"]').click(); await wait(60);
      q("#btn-fig-add").click(); q('[data-fig-combine="xor"]').click(); await wait(30);
      q("#btn-fig-save").click(); await wait(60);
      app.loadProjectText(JSON.stringify(JSON.parse(JSON.stringify(app.state))));
      assert(app.state.layers[0].combine === "xor", "The combination is saved and opened with the project");
      reset();
    });

    await test("Style per shape: Stroke or Fill, colour and stroke width belong to each shape; a new shape copies the selected one; Combine uses the base shape; modifiers change every shape's colour", async () => {
      reset();
      const d = win.document, q = (s) => d.querySelector(s), cv = d.getElementById("studio-canvas");
      const fire = (el, v) => { el.value = String(v); el.dispatchEvent(new win.Event("input", { bubbles: true })); el.dispatchEvent(new win.Event("change", { bubbles: true })); };
      // the editor draws on a canvas the size of the module (200 px): x and y are measured from the middle of the module
      const rgb = (x, y) => { const k = cv.width / 200; return Array.from(cv.getContext("2d").getImageData(Math.round((100 + x) * k), Math.round((100 + y) * k), 1, 1).data.slice(0, 3)); };
      const is = (c, r, g, b) => Math.abs(c[0] - r) < 40 && Math.abs(c[1] - g) < 40 && Math.abs(c[2] - b) < 40;
      const L = app.state.layers[0]; Object.assign(L, { shape: "circle", wireframe: true, color: "#0000ff", strokeWidth: 4, containerW: 200, containerH: 200 }); app.state.showSafeBounds = false;
      app.isFlyoutOpen = false; app.updateRailUI();
      q('[data-rail-tab="module"]').click(); await wait(60);
      fire(q("#input-fig-w"), 100); fire(q("#input-fig-h"), 100);
      // the first shape shows the module's look
      assert(q("#btn-mode-stroke").classList.contains("active") && q("#text-color-hex").textContent === "#0000FF" && q("#num-active-stroke").value === "4px", "The shape shows its look (the module's, until it has its own)");
      q("#btn-fig-add").click(); await wait(30);
      const second = () => L.figures[1];
      assert(second().wireframe === true && second().color === "#0000ff" && second().strokeWidth === 4, "A new shape copies the look of the selected one");
      // the second shape: Fill, red, in front of the first
      fire(q("#input-fig-w"), 60); fire(q("#input-fig-h"), 60); fire(q("#input-fig-x"), 50);
      q("#btn-mode-fill").click(); fire(q("#color-active-shape"), "#ff0000");
      assert(second().wireframe === false && second().color.toLowerCase() === "#ff0000" && L.figures[0].wireframe !== false && (L.figures[0].color || "").toLowerCase() !== "#ff0000", "The style went to the second shape only");
      drawRaw(app);
      // canvas: the module is 200 px, centred at 300; the first circle (100 px, stroke blue, centre 300), the second (60 px, fill red, centre 350)
      assert(is(rgb(50, 0), 255, 0, 0), `The second shape is filled red (${rgb(50, 0)})`);
      assert(is(rgb(0, -50), 0, 0, 255) || is(rgb(0, -49), 0, 0, 255) || is(rgb(0, -48), 0, 0, 255), `The first shape is a blue outline (${rgb(0, -50)})`);
      assert(rgb(-20, 10)[0] > 200 && rgb(-20, 10)[2] > 200, "The first shape is hollow in the middle");
      // selecting the first shape shows its own look
      q('#fig-list [data-fig-index="0"]').click(); await wait(30);
      assert(q("#btn-mode-stroke").classList.contains("active") && q("#text-color-hex").textContent === "#0000FF", "Selecting a shape shows its look");
      // Combine: one figure with the look of the base shape (the first): an outline, not a fill
      q('#fig-list [data-fig-index="1"]').click(); L.combine = "none"; q('[data-fig-combine="union"]').click(); await wait(30);
      drawRaw(app);
      assert(!is(rgb(50, 0), 255, 0, 0) && rgb(30, 0)[0] > 200, `A combined module takes the look of its base shape (${rgb(50, 0)} at the second shape)`);
      q('[data-fig-combine="union"]').click(); await wait(30); assert(L.combine === "none", "Pressing the operation that is on goes back to none");
      // a modifier's colour change reaches every shape: a mix towards green at 100 %
      L.figures[1].color = "#ff0000"; L.figures[1].wireframe = false;
      const ctx = cv.getContext("2d");
      drawRaw(app);
      app.engine.cellColorOps = [{ to: "#00ff00", t: 1 }];
      ctx.save(); ctx.setTransform(cv.width / 200, 0, 0, cv.height / 200, 0, 0); ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, 200, 200);
      ctx.translate(100, 100);
      const mod = JSON.parse(JSON.stringify(L)); mod.figures = L.figures; app.engine.state = app.state;
      app.engine.drawSingleLayerShape(ctx, mod, 1, "#18181f", "#ffffff", null, null, false, null);
      ctx.restore();
      assert(is(rgb(50, 0), 0, 255, 0), `The modifier's colour change reached the red shape (${rgb(50, 0)})`);
      // saved: the module takes the base look, and it is kept with the project
      q("#btn-fig-save").click(); await wait(60);
      assert(L.color === "#0000ff" && L.wireframe === true && L.strokeWidth === 4, "The module takes the look of its base shape");
      app.loadProjectText(JSON.stringify(JSON.parse(JSON.stringify(app.state))));
      const f2 = app.state.layers[0].figures[1];
      assert(f2.wireframe === false && f2.color.toLowerCase() === "#ff0000", "The look of each shape is saved and opened with the project");
      reset();
    });

    await test("Selectors are row dropdowns (label on the left, 132 px dropdown on the right); chips stay only for multiple choices; a long option reads in full", async () => {
      reset();
      const d = win.document, q = (sel) => d.querySelector(sel);
      for (const tab of ["layout", "anomaly", "concentration", "contrast", "gradation", "similarity", "space", "texture"]) {
        q(`[data-rail-tab="${tab}"]`).click(); await wait(60);
      }
      q('[data-rail-tab="anomaly"]').click(); await wait(80);
      const rows = [...d.querySelectorAll(".ds-field--row")];
      assert(rows.length >= 20 && rows.every(f => f.querySelector(".ds-dropdown")), `Row fields should all hold a dropdown (${rows.length})`);
      const single = ["data-anom-type", "data-anom-dist", "data-conc-mode", "data-conc-method", "data-space-mode", "data-rep-size", "data-rep-place", "data-rep-mix", "data-rad-size", "data-fig-rel"];
      for (const a of single) assert(q(`[${a}]`).classList.contains("ds-dropdown-item"), `${a} should be a dropdown item, not a chip`);
      assert(q("[data-anom-attr]").classList.contains("ds-tag"), "Deviates in lets several be on at once, so it stays as chips");
      // the menu of a row dropdown grows to show a long option in full
      const f = q('[data-anom-type]').closest(".ds-field"), item = f.querySelector(".ds-dropdown-item span"), old = item.textContent;
      assert(Math.round(f.querySelector(".ds-dropdown").getBoundingClientRect().width) === 132, "The dropdown is 132 px wide");
      item.textContent = "An exaggeratedly long option name that goes on and on for many words";
      const trigger = f.querySelector(".ds-dropdown-trigger"); trigger.click(); await wait(40);
      const menu = f.querySelector(".ds-dropdown-menu"), mw = menu.getBoundingClientRect().width;
      assert(mw > 132 && menu.scrollWidth <= Math.ceil(mw) + 1, `The menu should grow to read the option (${mw})`);
      item.textContent = old; trigger.click(); await wait(20);
      reset();
    });
    await test("Letters and numbers are filled outlines with straight ends (copied from the design): they fill, combine and keep their overlapping parts", async () => {
      reset();
      const d = win.document, cv = d.getElementById("studio-canvas");
      const dpr = cv.width / 600;
      const L = app.state.layers[0]; Object.assign(L, { shape: "circle", wireframe: false, containerW: 200, containerH: 200 }); app.state.showSafeBounds = false;
      const dark = (x, y) => cv.getContext("2d").getImageData(Math.round(x * dpr), Math.round(y * dpr), 1, 1).data[0] < 120;
      const ink = () => { const dd = cv.getContext("2d").getImageData(0, 0, cv.width, cv.height).data; let n = 0; for (let i = 0; i < dd.length; i += 4) if (dd[i] < 128) n++; return n; };
      for (const s of ["letterA", "letterS", "letterR", "digit1", "digit5", "digit9"]) {
        assert(!win.Shapes[s].skeleton && win.Shapes[s].draw && win.Shapes[s].svgPath, `${s} is a shape with an area`);
        L.figures = [{ shape: s, width: 200, height: 200, x: 0, y: 0, rotation: 0 }];
        drawRaw(app);
        assert(ink() > 3000, `${s} fills (${ink()} px of ink)`);
      }
      // the A: a leg, the bar and the place where the bar meets a leg (glyph x 22, y 67 of 89 x 100), with the middle between the legs empty
      L.figures = [{ shape: "letterA", width: 200, height: 200, x: 0, y: 0, rotation: 0 }];
      drawRaw(app);
      const gx = (x) => 300 + (x - 44.5) * 2, gy = (y) => 300 + (y - 50) * 2;
      assert(dark(gx(22), gy(67)) && dark(gx(44), gy(67)) && !dark(gx(44), gy(90)) && dark(gx(44), gy(5)), "The A has its legs, its bar and the opening under it");
      // two of them united are still an A (the bar overlaps the legs and must not cancel out there)
      L.figures = [{ shape: "letterA", width: 200, height: 200, x: 0, y: 0, rotation: 0 }, { shape: "letterA", width: 200, height: 200, x: 0, y: 0, rotation: 0 }];
      L.combine = "union"; drawRaw(app);
      assert(dark(gx(22), gy(67)) && dark(gx(44), gy(67)) && !dark(gx(44), gy(90)), "United with itself it is still the same A (nothing cancels where the bar meets the legs)");
      L.combine = "subtract"; drawRaw(app);
      assert(ink() < 200, `An A minus itself leaves nothing (${ink()})`);
      // the R keeps its bowl open: the counter of the R is empty, its stem and leg are filled
      L.combine = "none"; L.figures = [{ shape: "letterR", width: 200, height: 200, x: 0, y: 0, rotation: 0 }];
      drawRaw(app);
      const rx = (x) => 300 + (x - 37) * 2;
      assert(dark(rx(5), gy(50)) && dark(rx(60), gy(90)) && !dark(rx(30), gy(31)), "The R has its stem and leg, and an empty counter");
      L.combine = "union"; L.figures.push({ shape: "circle", width: 40, height: 40, x: -60, y: 70, rotation: 0 }); drawRaw(app);
      assert(dark(rx(5), gy(50)) && !dark(rx(30), gy(31)), "The R keeps its counter when it is combined with another shape");
      reset();
    });

    const failed = results.filter(r => !r.ok).length;
    summary.textContent = failed === 0 ? `All ${results.length} tests passed` : `${failed} of ${results.length} tests FAILED`;
    summary.className = failed === 0 ? "pass" : "fail";
    document.title = (failed === 0 ? "PASS" : "FAIL") + " — Module Studio smoke tests";
    window.__smokeResult = { total: results.length, failed, results };
  }

  document.getElementById("run").addEventListener("click", () => runAll());
  frame.addEventListener("load", () => runAll().catch(e => { summary.textContent = e.message; summary.className = "fail"; }));
})();
</script>

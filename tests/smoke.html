<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Module Studio — Smoke tests</title>
  <style>
    body { font: 14px/1.5 Inter, system-ui, sans-serif; margin: 24px; color: #282a36; background: #f7f7fa; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    p { margin: 0 0 16px; color: #63657b; }
    button { font: inherit; padding: 6px 14px; border-radius: 99px; border: 1px solid #282a36; background: #fff; cursor: pointer; }
    #summary { margin: 16px 0; font-weight: 600; }
    table { border-collapse: collapse; width: 100%; max-width: 860px; background: #fff; }
    td, th { text-align: left; padding: 8px 12px; border-bottom: 1px solid #e1e2eb; vertical-align: top; }
    .pass { color: #0a7a3d; font-weight: 600; }
    .fail { color: #c0262d; font-weight: 600; }
    iframe { position: absolute; left: -9999px; top: 0; width: 1280px; height: 900px; border: 0; }
  </style>
</head>
<body>
  <h1>Module Studio — Smoke tests</h1>
  <p>Open this page through a web server (<code>python3 -m http.server</code>, then <code>/tests/smoke.html</code>). Run it after every change, together with <code>python3 build-pro.py</code>.</p>
  <button id="run" type="button">Run again</button>
  <div id="summary">Running…</div>
  <table><thead><tr><th>Test</th><th>Result</th><th>Detail</th></tr></thead><tbody id="results"></tbody></table>
  <iframe id="app" title="Module Studio" src="../index.html"></iframe>

<script>
(() => {
  const frame = document.getElementById("app");
  const tbody = document.getElementById("results");
  const summary = document.getElementById("summary");
  const SHAPES = ["circle","square","triangle","wave","horseshoe","hexagon","line","parallelogram","hatch","crescent","teardrop","cross","digit1","digit5","digit9"];

  const wait = (ms) => new Promise(r => setTimeout(r, ms));

  async function waitForApp() {
    for (let i = 0; i < 100; i++) {
      try { if (frame.contentWindow.studioProApp) return frame.contentWindow; } catch (e) { throw new Error("Cannot reach the app: serve this page over http (not file://)."); }
      await wait(100);
    }
    throw new Error("The app did not start.");
  }

  // Deterministic random numbers so a failure can be reproduced.
  function makeRng(seed) {
    let s = seed;
    const rnd = () => { s = (s * 1664525 + 1013904223) % 4294967296; return s / 4294967296; };
    return { rnd, pick: (a) => a[Math.floor(rnd() * a.length)], ri: (a, b) => Math.floor(a + rnd() * (b - a + 1)), rb: () => rnd() < 0.5 };
  }

  function randomizeState(app, r) {
    const { rnd, pick, ri, rb } = r;
    const s = app.state;
    s.aspectRatio = pick(["1:1", "9:16", "4:3", "3:4", "16:9"]);
    s.invertFigureGround = rb(); s.showSafeBounds = rb();
    const target = ri(1, 5);
    while (s.layers.length < target) {
      const L = JSON.parse(JSON.stringify(s.layers[0])); const id = "layer-" + (s.layers.length + 1);
      L.id = id; L.name = "Layer " + (s.layers.length + 1); s.layers.push(L); s.layerOrder.unshift(id);
    }
    while (s.layers.length > target) { const L = s.layers.pop(); s.layerOrder = s.layerOrder.filter(x => x !== L.id); }
    for (const L of s.layers) {
      L.shape = pick(SHAPES); L.width = ri(5, 400); L.height = ri(5, 250); L.rotation = ri(0, 360);
      L.offsetX = ri(-250, 250); L.offsetY = ri(-250, 250); L.wireframe = rb(); L.strokeWidth = ri(1, 10) / 2; L.visible = rnd() < 0.9;
      const st = L.structure; st.enabled = rnd() < 0.8; st.mode = pick(["repetition", "radiation"]);
      const rp = st.repetition; rp.gridType = pick(["basic","sliding","sheared","curved","zigzag","triangular","alternating","hexagonal"]); rp.lineColor = pick(["","#cc2222","#ffffff"]); rp.lineDirection = pick(["both","horizontal","vertical"]); rp.lineSpacing = pick(["all","alternate"]); rp.reflection = pick(["none","columns","rows","both"]);
      rp.cols = ri(1, 50); rp.rows = ri(1, 50); rp.spacing = ri(0, 40); rp.shearAngle = ri(0, 45); rp.slideOffset = rnd(); rp.curveIntensity = ri(0, 60);
      rp.activeClipping = rb(); rp.showGridLines = rb(); rp.checkerInvert = rb(); rp.direction = pick(["repeated","alternated","undefined"]);
      const rd = st.radiation; rd.scheme = pick(["centrifugal","centripetal","concentric","spiral","multi_center"]); rd.orientation = pick(["auto","outward","inward","tangent","fixed"]); rd.centerOpen = ri(0, 70); rd.ringRotation = ri(-90, 90); rd.rays = ri(4, 28); rd.rings = ri(2, 10);
      rd.spiralTwist = ri(-180, 180); rd.centerX = ri(-200, 200); rd.centerY = ri(-200, 200); rd.showRays = rb(); rd.showRings = rb(); rd.activeClipping = rb(); rd.direction = pick(["repeated","alternated","undefined"]); rd.lineColor = pick(["","#2244cc"]); rd.lineWidth = ri(1, 12) / 2;
      const fs = st.formalStructure; fs.enabled = rnd() < 0.4; fs.colRatio = 1 + rnd() * 2; fs.rowRatio = 1 + rnd() * 2; fs.showGridLines = rb();
      const sm = st.similarity; sm.enabled = rb(); sm.kinshipType = pick(["distortion","foreshortening","rotation_wobble","scale_kinship","hybrid"]); sm.intensity = ri(0, 100); sm.cellJitter = ri(0, 30); sm.association = pick(["none","round","angular","lines","numbers"]); sm.assocMix = ri(0, 100); sm.imperfection = pick(["none","cut","broken"]); sm.imperfAmount = ri(0, 100);
      const g = st.gradation; g.enabled = rb(); g.type = pick(["rotation","scale","depth","drift","shape","texture"]); g.pathway = pick(["diagonal","horizontal","vertical","concentric","zigzag"]); g.range = ri(15, 360); g.steps = ri(1, 4); g.reverse = rb();
      g.sequence = pick(["restart","pingpong"]); g.easing = ri(-100, 100); g.alternate = rb(); g.targetShape = pick(SHAPES);
      const an = st.anomaly; an.enabled = rb(); an.type = pick(["focal","fracture","swell","tear"]); an.epicenterX = 0.1 + rnd() * 0.8; an.epicenterY = 0.1 + rnd() * 0.8; an.radius = ri(50, 350); an.intensity = ri(10, 100); an.anomalousShape = pick(SHAPES); an.highlightColor = rb(); an.showReticle = rb(); an.distribution = pick(["single","regular","random"]); an.count = ri(2, 12); an.seed = ri(1, 99); an.attrs = { shape: rb(), scale: rb(), rotation: rb(), position: rb() };
      const co = st.contrast; co.enabled = rb(); co.dimension = pick(["scale","shape","direction","tone","texture","space"]); co.dominanceRatio = ri(50, 95); co.scaleFactor = 0.2 + rnd() * 2.8; co.contrastShape = pick(SHAPES); co.angle = ri(15, 90); co.highlightContrast = rb();
      const cn = st.concentration; cn.enabled = rb(); cn.mode = pick(["point","void","line","line_void","free","dense","sparse"]); cn.method = pick(["move","absence"]); cn.edgeFade = rb(); cn.attractorX = 0.05 + rnd() * 0.9; cn.attractorY = 0.05 + rnd() * 0.9; cn.power = ri(20, 100); cn.radius = ri(80, 450); cn.lineAxis = pick(["horizontal","vertical"]); cn.alignToField = rb(); cn.densityScale = rb(); cn.showAttractor = rb();
      const tx = st.texture; tx.enabled = rb(); tx.jitter = ri(0, 8); tx.skipChance = ri(0, 60); tx.crossing = ri(0, 60); tx.undulation = ri(0, 30);
      const sp = st.space; sp.enabled = rb(); sp.mode = pick(["isometric","foreshortening","fluctuating","conflicting"]); sp.depth = ri(10, 80); sp.angle = ri(-60, 60); sp.shading = ri(20, 100); sp.showIsoGuides = rb();
    }
  }

  // Draws directly through the engine so exceptions are visible to the test (app.render() catches them).
  function drawRaw(app) {
    app.engine.state = app.state;
    app.applyAspectRatio(app.state.aspectRatio || "1:1");
    app.engine.render(app.getActivePalette());
  }

  function inkPixels(win) {
    const cv = win.document.getElementById("studio-canvas");
    const d = cv.getContext("2d").getImageData(0, 0, cv.width, cv.height).data;
    let n = 0; for (let i = 0; i < d.length; i += 4) if (d[i] < 150 && d[i + 1] < 150 && d[i + 2] < 150) n++;
    return n;
  }

  let running = false; // two overlapping runs would share the app state and corrupt each other

  async function runAll() {
    if (running) return;
    running = true;
    try { await runAllInner(); } finally { running = false; }
  }

  async function runAllInner() {
    tbody.innerHTML = ""; summary.textContent = "Running…";
    window.__smokeResult = null;
    const win = await waitForApp();
    await wait(300);
    const app = win.studioProApp;
    const initial = JSON.stringify(app.state);
    const reset = () => { app.state = JSON.parse(initial); app.activeLayerId = app.state.layers[0].id; app.engine.state = app.state; };
    const results = [];
    const record = (name, ok, detail = "") => {
      results.push({ name, ok, detail });
      const tr = document.createElement("tr");
      tr.innerHTML = `<td>${name}</td><td class="${ok ? "pass" : "fail"}">${ok ? "PASS" : "FAIL"}</td><td>${detail}</td>`;
      tbody.appendChild(tr);
    };
    const test = async (name, fn) => {
      try { const detail = await fn(); record(name, true, detail || ""); }
      catch (e) { record(name, false, e && e.message ? e.message : String(e)); }
      finally { reset(); }
    };
    const assert = (cond, msg) => { if (!cond) throw new Error(msg); };

    // Count save/restore calls inside the app window.
    const proto = win.CanvasRenderingContext2D.prototype;
    let saves = 0, restores = 0;
    if (!proto.__smokeWrapped) {
      const oS = proto.save, oR = proto.restore;
      proto.save = function () { saves++; return oS.apply(this, arguments); };
      proto.restore = function () { restores++; return oR.apply(this, arguments); };
      proto.__smokeWrapped = true;
    }

    await test("App starts and draws the default composition", () => {
      drawRaw(app);
      const ink = inkPixels(win);
      assert(ink > 100, `Canvas looks empty (${ink} dark pixels)`);
      return `${ink} dark pixels`;
    });

    await test("All 15 shapes draw in stroke and fill mode", () => {
      for (const shape of SHAPES) for (const wire of [true, false]) {
        reset(); const L = app.state.layers[1]; L.shape = shape; L.wireframe = wire;
        drawRaw(app);
        assert(inkPixels(win) > 100, `${shape} (${wire ? "stroke" : "fill"}) drew nothing`);
      }
      return "30 combinations";
    });

    await test("400 random combinations: no exception, balanced canvas state", () => {
      reset();
      const r = makeRng(12345);
      let failures = [], unbalanced = 0, maxMs = 0, total = 0;
      for (let n = 0; n < 400; n++) {
        randomizeState(app, r);
        saves = restores = 0;
        const t0 = performance.now();
        try { drawRaw(app); } catch (e) { failures.push(`#${n}: ${e.message}`); continue; }
        const dt = performance.now() - t0; total += dt; maxMs = Math.max(maxMs, dt);
        if (saves !== restores) unbalanced++;
      }
      assert(failures.length === 0, `${failures.length} exceptions, first: ${failures[0]}`);
      assert(unbalanced === 0, `${unbalanced} renders left an unbalanced save/restore`);
      return `avg ${Math.round(total / 400)} ms, worst ${Math.round(maxMs)} ms`;
    });

    await test("Texture is deterministic (same settings, same picture)", () => {
      reset();
      const L = app.state.layers[1]; L.structure.enabled = true; L.structure.texture = { enabled: true, jitter: 4, skipChance: 20, crossing: 20, undulation: 12 };
      drawRaw(app); const a = win.document.getElementById("studio-canvas").toDataURL();
      drawRaw(app); const b = win.document.getElementById("studio-canvas").toDataURL();
      assert(a === b, "Two identical renders differ (texture flickers)");
    });

    await test("Undo and redo restore a per-layer setting", () => {
      reset();
      app.history = []; app.historyLabels = []; app.historyIndex = -1;
      const tex = () => app.getActiveLayerStructure().texture;
      tex().jitter = 1; app.pushHistory("a");
      tex().jitter = 7; app.pushHistory("b");
      app.undo(); assert(tex().jitter === 1, `After undo expected 1, got ${tex().jitter}`);
      app.redo(); assert(tex().jitter === 7, `After redo expected 7, got ${tex().jitter}`);
    });

    await test("Layers: add up to 5, every layer keeps all setting blocks, delete down to 1", async () => {
      reset();
      const add = win.document.getElementById("btn-add-pattern");
      for (let i = 0; i < 6; i++) { add.click(); await wait(30); }
      assert(app.state.layers.length === 5, `Expected 5 layers, got ${app.state.layers.length}`);
      const blocks = ["repetition","radiation","formalStructure","similarity","gradation","anomaly","contrast","concentration","texture","space"];
      const missing = app.state.layers.flatMap(l => blocks.filter(b => !l.structure[b]).map(b => `${l.id}:${b}`));
      assert(missing.length === 0, "Missing blocks: " + missing.join(", "));
      for (let i = 0; i < 6; i++) {
        const del = win.document.querySelector('#layers-stack-container [title*="elete"], #layers-stack-container [data-action="delete"]');
        if (!del) break; del.click(); await wait(30);
      }
      assert(app.state.layers.length === 1, `Expected 1 layer after deleting, got ${app.state.layers.length}`);
    });

    await test("Inspector panels (Module, Layout, Structure, Similarity) drive the layer state", async () => {
      reset();
      const d = win.document, q = (sel) => d.querySelector(sel);
      const fire = (el, v) => { el.value = v; el.dispatchEvent(new win.Event("input", { bubbles: true })); el.dispatchEvent(new win.Event("change", { bubbles: true })); };
      const tab = async (t) => { q(`[data-rail-tab="${t}"]`).click(); await wait(80); };
      const st = () => app.getActiveLayerStructure();

      await tab("layout");
      q("#toggle-layout-structure").click();
      assert(st().enabled === true, "Layout switch did not enable the layout");
      q('[data-grid-var="curved"]').click();
      assert(st().repetition.gridType === "curved", "Grid variation tag did not apply");
      fire(q("#input-layout-cols"), 7);
      assert(st().repetition.cols === 7 && q("#num-layout-cols").value === "7", "Columns slider and value box out of sync");
      q("#btn-layout-radiation").click(); await wait(60);
      assert(st().mode === "radiation", "Radiation button did not switch the mode");
      assert(q("#subpanel-repetition").classList.contains("hidden") && !q("#subpanel-radiation").classList.contains("hidden"), "Sub-panels did not swap");
      assert(q("#btn-layout-radiation").classList.contains("active") && !q("#btn-layout-repetition").classList.contains("active"), "Button group active state wrong");

      q("#btn-layout-repetition").click(); await wait(60);
      assert(!q("#subpanel-repetition").classList.contains("hidden"), "Repetition sub-panel should come back");
      fire(q("#input-struct-col-ratio"), 2.5);
      assert(st().formalStructure.colRatio === 2.5, "Rhythm col ratio (Layout > Advanced) did not apply");
      assert(!q('[data-rail-tab="structure"]') && !q("#card-structure"), "The Structure panel should be gone (its rhythm lives in Layout > Advanced)");

      await tab("similarity");
      q("#toggle-similarity-active").click();
      q('[data-kinship-type="hybrid"]').click();
      fire(q("#input-sim-intensity"), 80);
      assert(st().similarity.enabled && st().similarity.kinshipType === "hybrid" && st().similarity.intensity === 80, "Similarity controls did not apply");
      assert(q("#num-sim-intensity").value === "80%", "Similarity value box format wrong");

      await tab("module");
      q('[data-shape="hexagon"]').click();
      fire(q("#input-active-width"), 120);
      q("#btn-mode-fill").click();
      const L = app.getActiveModule();
      assert(L.shape === "hexagon" && L.width === 120 && L.wireframe === false, "Module controls did not apply");
      assert(q("#btn-mode-fill").classList.contains("active") && !q("#btn-mode-stroke").classList.contains("active"), "Fill / Stroke group active state wrong");
    });

    await test("Layout variations expose their own parameter and the line width", async () => {
      reset();
      const d = win.document, q = (sel) => d.querySelector(sel);
      const fire = (el, v) => { el.value = v; el.dispatchEvent(new win.Event("input", { bubbles: true })); el.dispatchEvent(new win.Event("change", { bubbles: true })); };
      q('[data-rail-tab="layout"]').click(); await wait(80);
      q("#toggle-layout-structure").click();
      const rep = () => app.getActiveLayerStructure().repetition;
      const expected = { basic: null, sliding: "Row offset", sheared: "Shear angle", curved: "Wave amount", zigzag: "Wave amount", triangular: null, alternating: null };
      for (const [gt, label] of Object.entries(expected)) {
        q(`[data-grid-var="${gt}"]`).click(); await wait(40);
        assert(rep().gridType === gt, `Variation ${gt} did not apply`);
        const shown = !q("#rep-param-block").classList.contains("hidden");
        assert(shown === !!label, `${gt}: parameter control ${shown ? "shown" : "hidden"} unexpectedly`);
        if (label) assert(q("#rep-param-label").textContent === label, `${gt}: label is "${q("#rep-param-label").textContent}", expected "${label}"`);
        drawRaw(app);
      }
      q('[data-grid-var="sliding"]').click(); fire(q("#input-layout-param"), 30);
      assert(Math.abs(rep().slideOffset - 0.3) < 1e-9 && q("#num-layout-param").value === "30%", "Row offset did not apply");
      q('[data-grid-var="sheared"]').click(); fire(q("#input-layout-param"), 20);
      assert(rep().shearAngle === 20 && q("#num-layout-param").value === "20º", "Shear angle did not apply");
      q('[data-grid-var="curved"]').click(); fire(q("#input-layout-param"), 40);
      assert(rep().curveIntensity === 40 && q("#num-layout-param").value === "40px", "Wave amount did not apply");
      assert(q("#rep-lines-block").classList.contains("hidden"), "Line width should be hidden while grid lines are off");
      q("#chk-rep-gridlines").click();
      assert(!q("#rep-lines-block").classList.contains("hidden"), "Line width should show with grid lines on");
      fire(q("#input-layout-linewidth"), 3);
      assert(rep().gridLineWidth === 3 && q("#num-layout-linewidth").value === "3px", "Line width did not apply");
    });

    await test("Every control has an accessible name and toggles expose their state", () => {
      const d = win.document;
      const textOf = (id) => (d.getElementById(id)?.textContent || "").trim();
      const nameOf = (el) => {
        if (el.getAttribute("aria-label")) return el.getAttribute("aria-label");
        const lb = el.getAttribute("aria-labelledby");
        if (lb) return lb.split(/\s+/).map(textOf).join(" ").trim();
        if (el.id && d.querySelector(`label[for="${el.id}"]`)) return d.querySelector(`label[for="${el.id}"]`).textContent.trim();
        const wrap = el.closest("label");
        if (wrap) return wrap.textContent.trim() || wrap.getAttribute("title") || "";
        return (el.textContent || "").trim();
      };
      const missing = [];
      d.querySelectorAll("input:not([type=hidden]), select, textarea, button").forEach((el) => {
        if (!nameOf(el)) missing.push(`${el.tagName.toLowerCase()}${el.id ? "#" + el.id : ""}${el.className ? "." + String(el.className).split(" ")[0] : ""}`);
      });
      assert(missing.length === 0, `${missing.length} controls without a name, first: ${missing.slice(0, 5).join(", ")}`);
      const wrong = [];
      d.querySelectorAll(".ds-tag, .ds-btn-group__button, .shape-circle-btn").forEach((el) => {
        const pressed = el.getAttribute("aria-pressed");
        if (pressed !== (el.classList.contains("active") ? "true" : "false")) wrong.push(el.className);
      });
      assert(wrong.length === 0, `${wrong.length} toggles with a wrong aria-pressed state`);
      d.querySelectorAll("#controls-rail .rail-btn").forEach((el) => {
        if (el.getAttribute("aria-expanded") !== (el.classList.contains("active") ? "true" : "false")) wrong.push("rail aria-expanded");
        const on = el.classList.contains("has-modifier-active");
        if (!(el.getAttribute("aria-label") || "").endsWith(on ? ", on" : ", off")) wrong.push("rail aria-label " + el.dataset.railTab);
      });
      assert(wrong.length === 0, `Rail buttons out of sync: ${wrong.join(", ")}`);
      const cards = d.querySelectorAll(".layer-card");
      assert(cards.length > 0 && Array.from(cards).every((c) => c.getAttribute("role") === "button" && c.getAttribute("tabindex") === "0"), "Layer cards are not keyboard reachable");
    });

    await test("Vector SVG export is real vector and matches the canvas", async () => {
      const cv = win.document.getElementById("studio-canvas");
      const toImage = (svg) => new Promise((res, rej) => {
        const img = new win.Image();
        img.onload = () => res(img); img.onerror = () => rej(new Error("The SVG could not be loaded as an image"));
        img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
      });
      const rng = makeRng(31);
      let worst = 0, bytes = 0;
      for (let n = 0; n < 6; n++) {
        reset();
        if (n > 0) {
          randomizeState(app, rng);
          for (const L of app.state.layers) { L.structure.repetition.cols = Math.min(L.structure.repetition.cols, 12); L.structure.repetition.rows = Math.min(L.structure.repetition.rows, 12); L.structure.radiation.rays = Math.min(L.structure.radiation.rays, 16); L.structure.radiation.rings = Math.min(L.structure.radiation.rings, 6); }
        }
        app.engine.exporting = true; drawRaw(app); app.engine.exporting = false; // guide lines are on screen only
        const svg = win.StudioExporter.buildSVG(app.engine, cv, app.getActivePalette());
        bytes = Math.max(bytes, svg.length);
        const doc = new win.DOMParser().parseFromString(svg, "image/svg+xml");
        assert(!doc.querySelector("parsererror"), `State ${n}: the SVG is not well formed`);
        assert(!doc.querySelector("image"), `State ${n}: the SVG embeds a raster image`);
        assert(doc.querySelectorAll("path").length > 0, `State ${n}: the SVG has no paths`);
        const img = await toImage(svg);
        const off = win.document.createElement("canvas"); off.width = cv.width; off.height = cv.height;
        const octx = off.getContext("2d"); octx.drawImage(img, 0, 0, cv.width, cv.height);
        const a = cv.getContext("2d").getImageData(0, 0, cv.width, cv.height).data;
        const b = octx.getImageData(0, 0, cv.width, cv.height).data;
        let bad = 0; for (let i = 0; i < a.length; i += 4) if (Math.abs(a[i] - b[i]) > 80) bad++;
        const frac = bad / (a.length / 4);
        worst = Math.max(worst, frac);
        assert(frac < 0.02, `State ${n}: ${(frac * 100).toFixed(1)}% of pixels differ from the canvas`);
      }
      return `worst difference ${(worst * 100).toFixed(2)}%, largest file ${Math.round(bytes / 1024)} KB`;
    });

    await test("Saved projects reopen, and damaged files are cleaned up or refused", () => {
      reset();
      const original = JSON.parse(JSON.stringify(app.state));
      randomizeState(app, makeRng(5));
      const saved = JSON.parse(JSON.stringify(app.state));
      app.loadProjectText(JSON.stringify({ app: "module-studio", version: 1, state: saved }));
      assert(JSON.stringify(app.state) === JSON.stringify(saved), "A saved project does not reopen identically");
      // the older format (the bare state) also opens
      app.loadProjectText(JSON.stringify(original));
      assert(JSON.stringify(app.state.layers.map(l => l.shape)) === JSON.stringify(original.layers.map(l => l.shape)), "The bare-state format does not open");
      // damaged: unknown shape, wrong types, missing blocks, too many layers
      const bad = JSON.parse(JSON.stringify(original));
      bad.layers[0].shape = "nonsense"; bad.layers[0].width = "wide"; delete bad.layers[0].structure.texture; bad.aspectRatio = "7:3";
      for (let i = 0; i < 7; i++) bad.layers.push(JSON.parse(JSON.stringify(original.layers[0])));
      app.loadProjectText(JSON.stringify(bad));
      assert(app.state.layers.length === 5, "More than 5 layers were accepted");
      assert(app.state.layers[0].shape === "circle" && typeof app.state.layers[0].width === "number", "Bad values were not replaced by defaults");
      assert(app.state.layers[0].structure.texture && app.state.aspectRatio === "1:1", "Missing blocks were not restored");

      // From a line: the inverse of Line
      const toward = e.applyConcentration(conc({ mode: "line" }), 340, 100, 600, 600).x;
      const away = e.applyConcentration(conc({ mode: "line_void" }), 340, 100, 600, 600).x;
      assert(toward < 340 && away > 340, `Line should pull (${toward}) and Away from line should push (${away})`);
      assert(e.applyConcentration(conc({ mode: "line_void" }), 100, 100, 600, 600).x === 100, "Outside the field nothing should move");
      // Absence: modules do not move; the chance of being drawn follows the density
      const near = e.applyConcentration(conc({ method: "absence" }), 300, 300, 600, 600);
      const faraway = e.applyConcentration(conc({ method: "absence" }), 20, 20, 600, 600);
      assert(near.keep === 1 && near.x === 300 && Math.abs(faraway.keep - 0.5) < 1e-9 && faraway.x === 20, `Absence keep ${near.keep} near and ${faraway.keep} far`);
      const hole = e.applyConcentration(conc({ method: "absence", mode: "void" }), 300, 300, 600, 600);
      assert(hole.keep < 1 && e.applyConcentration(conc({ method: "absence", mode: "void" }), 20, 20, 600, 600).keep === 1, "Void by absence should empty the centre");
      assert(e.applyConcentration(conc({ mode: "point" }), 300, 300, 600, 600).keep === 1, "Moving modules should always be drawn");
      // Drawing: absence removes modules, the same ones on every draw
      reset();
      const cv = win.document.getElementById("studio-canvas");
      const render = (c) => {
        const st = JSON.parse(JSON.stringify(app.state));
        st.layers = [st.layers[0]]; st.layerOrder = [st.layers[0].id]; st.showSafeBounds = false; st.aspectRatio = "1:1";
        const L = st.layers[0];
        Object.assign(L, { shape: "circle", width: 60, height: 60, offsetX: 0, offsetY: 0, rotation: 0, wireframe: false, containerW: 0, containerH: 0 });
        L.structure.enabled = true; L.structure.mode = "repetition";
        Object.assign(L.structure.repetition, { cols: 10, rows: 10, gridType: "basic", sizeMode: "fit" });
        Object.assign(L.structure.concentration, { enabled: true, mode: "point", method: "move", power: 100, radius: 150, attractorX: 0.5, attractorY: 0.5 }, c);
        app.state = st; drawRaw(app);
        return cv.getContext("2d").getImageData(0, 0, cv.width, cv.height).data;
      };
      const ink = (d) => { let n = 0; for (let i = 0; i < d.length; i += 4) if (d[i] < 128) n++; return n; };
      const none = render({ enabled: false });
      const gone = render({ method: "absence" });
      assert(ink(gone) < ink(none) * 0.7 && ink(gone) > 0, `Absence should remove modules (${ink(gone)} of ${ink(none)})`);
      assert(JSON.stringify(Array.from(gone.slice(0, 4000))) === JSON.stringify(Array.from(render({ method: "absence" }).slice(0, 4000))), "Absence should remove the same modules every time");
      // Inspector
      const d = win.document, q = (sel) => d.querySelector(sel);
      q('[data-rail-tab="concentration"]').click(); await wait(80);
      const cs = () => app.getActiveLayerStructure().concentration;
      assert(!q("#conc-method-block").classList.contains("hidden") && q("#conc-fade-block").classList.contains("hidden"), "Point should offer the method and no fade");
      q('[data-conc-method="absence"]').click();
      assert(cs().method === "absence" && q('[data-conc-method="absence"]').classList.contains("active"), "Absence chip did not apply");
      q('[data-conc-mode="line_void"]').click();
      assert(cs().mode === "line_void" && !q("#conc-axis-block").classList.contains("hidden"), "Away from line should offer the axis");
      q('[data-conc-mode="dense"]').click();
      assert(q("#conc-method-block").classList.contains("hidden") && q("#conc-radius-field").classList.contains("hidden") && !q("#conc-fade-block").classList.contains("hidden"), "Dense should hide method and radius and offer the edge fade");
      q("#toggle-conc-fade").click();
      assert(cs().edgeFade === true, "Edge fade did not apply");
    });

    await test("Direction (repeated, alternated, undefined) and radial line tone and width", async () => {
      reset();
      const cv = win.document.getElementById("studio-canvas");
      const render = (rep, rad = {}, mode = "repetition", layer = {}) => {
        const st = JSON.parse(JSON.stringify(app.state));
        st.layers = [st.layers[0]]; st.layerOrder = [st.layers[0].id]; st.showSafeBounds = false; st.aspectRatio = "1:1";
        const L = st.layers[0];
        Object.assign(L, { shape: "triangle", width: 400, height: 400, offsetX: 0, offsetY: 0, rotation: 0, wireframe: false, containerW: 0, containerH: 0 }, layer);
        L.structure.enabled = true; L.structure.mode = mode;
        Object.assign(L.structure.repetition, { cols: 4, rows: 4, gridType: "basic", sizeMode: "fit", direction: "repeated" }, rep);
        Object.assign(L.structure.radiation, { rays: 12, rings: 4, scheme: "concentric", orientation: "fixed", direction: "repeated", showRays: false, showRings: false, lineColor: "", lineWidth: 1 }, rad);
        app.state = st; drawRaw(app);
        return cv.getContext("2d").getImageData(0, 0, cv.width, cv.height).data;
      };
      const dpr = cv.width / 600;
      const px = (d, x, y) => d[(Math.round(y * dpr) * cv.width + Math.round(x * dpr)) * 4];
      const diff = (a, b) => { let n = 0; for (let i = 0; i < a.length; i += 4) if (Math.abs(a[i] - b[i]) > 60) n++; return n; };
      // Cell (0,0) is x 0..150, y 0..150: the triangle points up when repeated, down when its cell turned 180°
      const rep = render({});
      const topWide = (d, r, c) => { let n = 0; for (let x = c * 150; x < c * 150 + 150; x++) if (px(d, x, r * 150 + 50) < 128) n++; return n; };
      const botWide = (d, r, c) => { let n = 0; for (let x = c * 150; x < c * 150 + 150; x++) if (px(d, x, r * 150 + 100) < 128) n++; return n; };
      assert(botWide(rep, 0, 0) > topWide(rep, 0, 0), "A repeated triangle is wider at the bottom");
      const alt = render({ direction: "alternated" });
      assert(botWide(alt, 0, 0) > topWide(alt, 0, 0) && botWide(alt, 0, 1) < topWide(alt, 0, 1), "Alternated cells should turn upside down every other cell");
      const und = render({ direction: "undefined" });
      assert(diff(rep, und) > 500 && diff(und, render({ direction: "undefined" })) === 0, "Undefined should differ from repeated and be the same on every draw");
      assert(diff(rep, render({ direction: "repeated" })) === 0, "Repeated is the default");
      // Radial
      const rr = render({}, {}, "radiation"), ra = render({}, { direction: "alternated" }, "radiation"), ru = render({}, { direction: "undefined" }, "radiation");
      assert(diff(rr, ra) > 100 && diff(rr, ru) > 100, "Radial direction should change the modules");
      // Radial line tone and width (the rays and rings are drawn at 252 px from the centre at most)
      const lines = (o) => render({}, { showRings: true, showRays: false, rings: 4, ...o }, "radiation", { width: 10, height: 10 });
      const ringPixel = (d) => px(d, 300 + 252, 300); // outer ring, on its right
      assert(ringPixel(lines({ lineWidth: 3 })) < 100, "Positive radial lines are not drawn in ink");
      assert(ringPixel(lines({ lineColor: "#ffffff", lineWidth: 3 })) > 200, "A white line colour should draw white rings");
      let thin = 0, thick = 0; const t1 = lines({ lineWidth: 1 }), t6 = lines({ lineWidth: 6 });
      for (let x = 540; x < 560; x++) { if (px(t1, x, 300) < 128) thin++; if (px(t6, x, 300) < 128) thick++; }
      assert(thick > thin * 3, `Line width did not thicken the rings (${thin} against ${thick})`);
      // Inspector
      reset();
      const d = win.document, q = (sel) => d.querySelector(sel);
      q('[data-rail-tab="layout"]').click(); await wait(80);
      q("#toggle-layout-structure").click();
      const rp = () => app.getActiveLayerStructure().repetition, rd = () => app.getActiveLayerStructure().radiation;
      q('[data-rep-dir="alternated"]').click();
      assert(rp().direction === "alternated" && q('[data-rep-dir="alternated"]').classList.contains("active"), "Direction chip did not apply");
      q("#btn-layout-radiation").click(); await wait(60);
      q('[data-rad-dir="undefined"]').click();
      assert(rd().direction === "undefined" && q('[data-rad-dir="undefined"]').classList.contains("active"), "Radial direction chip did not apply");
      assert(q("#rad-lines-block").classList.contains("hidden"), "Radial line options should be hidden while the lines are off");
      q("#chk-rad-gridlines").click(); await wait(40);
      assert(!q("#rad-lines-block").classList.contains("hidden"), "Radial line options should show with the lines on");
      const rc = q("#radline-accent-color"); rc.value = "#336699"; rc.dispatchEvent(new win.Event("input", { bubbles: true }));
      assert(rd().lineColor === "#336699", "Radial line colour did not apply");
    });

    await test("A failed draw shows a visible notice and recovers", () => {
      reset();
      const original = app.engine.render;
      app.engine.render = () => { throw new Error("forced failure"); };
      const origError = win.console.error; win.console.error = () => {};
      app.render();
      win.console.error = origError;
      const box = win.document.getElementById("render-error");
      assert(box && !box.hidden && /forced failure/.test(box.textContent), "No visible error notice");
      app.engine.render = original;
      app.render();
      assert(win.document.getElementById("render-error").hidden, "Notice stays after a successful draw");
    });

    await test("Visible lines are part of the design: own colour and width, and they are exported", () => {
      reset();
      const cv = win.document.getElementById("studio-canvas");
      const setup = (on, mode) => {
        const st = JSON.parse(JSON.stringify(app.state));
        st.layers = [st.layers[0]]; st.layerOrder = [st.layers[0].id]; st.showSafeBounds = false; st.aspectRatio = "1:1";
        const L = st.layers[0];
        Object.assign(L, { shape: "circle", width: 20, height: 20, offsetX: 0, offsetY: 0, rotation: 0 });
        L.structure.enabled = true; L.structure.mode = mode;
        Object.assign(L.structure.repetition, { cols: 3, rows: 3, gridType: "basic", showGridLines: on, lineColor: "#00aa00", gridLineWidth: 3 });
        Object.assign(L.structure.radiation, { rays: 8, rings: 3, showRays: on, showRings: on, lineColor: "#00aa00", lineWidth: 3 });
        app.state = st; app.engine.state = st; drawRaw(app);
      };
      const svg = () => win.StudioExporter.buildSVG(app.engine, cv, app.getActivePalette());
      for (const mode of ["repetition", "radiation"]) {
        setup(true, mode);
        const screen = app.engine.canvas.getContext("2d").getImageData(0, 0, cv.width, cv.height).data;
        let green = 0; for (let i = 0; i < screen.length; i += 4) if (screen[i + 1] > 140 && screen[i] < 80) green++;
        assert(green > 100, `${mode}: the lines should show in their own colour`);
        assert(/#00aa00/i.test(svg()), `${mode}: the lines should be exported`);
        setup(false, mode);
        assert(!/#00aa00/i.test(svg()), `${mode}: no lines should be exported while they are off`);
      }
    });

    await test("Structure: modules at intersections, interwoven classes and merged or divided cell blocks", () => {
      reset();
      const cv = win.document.getElementById("studio-canvas");
      const render = (rep, layer = {}) => {
        const st = JSON.parse(JSON.stringify(app.state));
        st.layers = [st.layers[0]]; st.layerOrder = [st.layers[0].id]; st.showSafeBounds = false; st.aspectRatio = "1:1";
        const L = st.layers[0];
        Object.assign(L, { shape: "square", width: 60, height: 60, offsetX: 0, offsetY: 0, rotation: 0, wireframe: false, containerW: 0, containerH: 0 }, layer);
        L.structure.enabled = true; L.structure.mode = "repetition";
        Object.assign(L.structure.repetition, { cols: 4, rows: 4, gridType: "basic", sizeMode: "fit", showGridLines: false, placement: "centers", interScale: 50, cellMix: "none" }, rep);
        app.state = st; drawRaw(app);
        return cv.getContext("2d").getImageData(0, 0, cv.width, cv.height).data;
      };
      const dpr = cv.width / 600;
      const dark = (d, x, y) => d[(Math.round(y * dpr) * cv.width + Math.round(x * dpr)) * 4] < 100;
      const inkOf = (d) => { let n = 0; for (let i = 0; i < d.length; i += 4) if (d[i] < 100) n++; return n; };
      // 4x4 on 600px: cells of 150, centres at 75, 225... intersections at 150, 300...
      const centers = render({});
      assert(dark(centers, 75, 75) && !dark(centers, 150, 150), "Centers: modules sit in the cell centres only");
      const inter = render({ placement: "intersections", interScale: 100 });
      assert(dark(inter, 150, 150) && dark(inter, 300, 300) && !dark(inter, 75, 75), "Intersections: modules sit on the line crossings");
      assert(dark(inter, 3, 3) && dark(inter, 597, 597), "Intersections include the outer corners of the grid");
      const both = render({ placement: "both", interScale: 50 });
      assert(dark(both, 75, 75) && dark(both, 150, 150), "Both: the two classes are interwoven");
      const smallArea = inkOf(render({ placement: "intersections", interScale: 40 })), bigArea = inkOf(render({ placement: "intersections", interScale: 100 }));
      assert(smallArea < bigArea * 0.5, "Intersection size should scale the interwoven modules");
      // Merged: the first 2x2 block (top-left) becomes one module twice as big, centred on x,y = 150
      const merged = render({ cellMix: "merge" });
      assert(dark(merged, 150, 150) && !dark(merged, 75, 75), "Merged: the top-left block should be one big centred module");
      assert(dark(merged, 375, 75) && dark(merged, 525, 75), "Merged: the other blocks keep their four cells");
      // Divided: the same block holds smaller modules, four per cell
      const divided = render({ cellMix: "divide" });
      assert(inkOf(divided) !== inkOf(centers) && dark(divided, 75 - 37, 75 - 37), "Divided: the top-left block should hold smaller modules");
      reset();
    });

    await test("A stretched shape keeps a uniform stroke (the line does not stretch with the figure)", () => {
      reset();
      const cv = win.document.getElementById("studio-canvas");
      const st = JSON.parse(JSON.stringify(app.state));
      st.layers = [st.layers[0]]; st.layerOrder = [st.layers[0].id]; st.showSafeBounds = false; st.aspectRatio = "1:1";
      const L = st.layers[0];
      Object.assign(L, { shape: "circle", width: 300, height: 100, offsetX: 0, offsetY: 0, rotation: 0, wireframe: true, strokeWidth: 8, containerW: 0, containerH: 0 });
      L.structure.enabled = false;
      app.state = st; drawRaw(app);
      const d = cv.getContext("2d").getImageData(0, 0, cv.width, cv.height).data;
      const dpr = cv.width / 600;
      const dark = (x, y) => d[(Math.round(y * dpr) * cv.width + Math.round(x * dpr)) * 4] < 128;
      // top of the oval: vertical run through x=300; its left tip: horizontal run through y=300
      let top = 0; for (let y = 100; y < 300; y += 0.25) if (dark(300, y)) top += 0.25; else if (top) break;
      let left = 0; for (let x = 100; x < 300; x += 0.25) if (dark(x, 300)) left += 0.25; else if (left) break;
      assert(top > 6 && top < 10 && left > 6 && left < 10, `Stroke is not uniform: ${top}px on top, ${left}px at the tip (expected about 8)`);
      reset();
    });

    await test("Rhythm (Col and Row ratio) scales the grid in Fit and in Actual size", () => {
      reset();
      const cv = win.document.getElementById("studio-canvas");
      const render = (sizeMode, colRatio, rowRatio = 1) => {
        const st = JSON.parse(JSON.stringify(app.state));
        st.layers = [st.layers[0]]; st.layerOrder = [st.layers[0].id]; st.showSafeBounds = false; st.aspectRatio = "1:1";
        const L = st.layers[0];
        Object.assign(L, { shape: "square", width: 20, height: 20, offsetX: 0, offsetY: 0, rotation: 0, wireframe: false, containerW: 100, containerH: 100 });
        L.structure.enabled = true; L.structure.mode = "repetition";
        Object.assign(L.structure.repetition, { cols: 4, rows: 1, gridType: "basic", sizeMode, showGridLines: false, placement: "centers", cellMix: "none" });
        L.structure.formalStructure = { enabled: true, colRatio, rowRatio, showGridLines: false };
        app.state = st; drawRaw(app);
        return cv.getContext("2d").getImageData(0, 0, cv.width, cv.height).data;
      };
      const dpr = cv.width / 600;
      const dark = (d, x, y) => d[(Math.round(y * dpr) * cv.width + Math.round(x * dpr)) * 4] < 100;
      // Actual size, 100 px container, 4 columns: with ratio 1 the centres are 150, 250, 350, 450
      const flat = render("actual", 1);
      assert(dark(flat, 150, 300) && dark(flat, 250, 300) && dark(flat, 350, 300) && dark(flat, 450, 300), "Actual size without rhythm: modules every 100 px");
      // ratio 3: columns 300, 100, 300, 100 wide, centred: centres at 50, 250, 450 (the 4th is past the canvas)
      const rhythm = render("actual", 3);
      assert(dark(rhythm, 50, 300) && dark(rhythm, 250, 300) && dark(rhythm, 450, 300) && !dark(rhythm, 150, 300), "Actual size: the A columns should be 3 times wider");
      // Rows in Actual size: a single row of 100 px with ratio 3 becomes 300 px tall, still centred
      const rows = render("actual", 1, 3);
      assert(dark(rows, 150, 300), "Row ratio keeps the single row centred");
      // Fit still works
      const fit = render("fit", 3);
      assert(JSON.stringify(Array.from(fit)) !== JSON.stringify(Array.from(render("fit", 1))), "Fit: the ratio should change the drawing");
      reset();
    });

    await test("Checkerboard reverses figure and ground, also with a coloured module", () => {
      reset();
      const cv = win.document.getElementById("studio-canvas");
      const render = (color) => {
        const st = JSON.parse(JSON.stringify(app.state));
        st.layers = [st.layers[0]]; st.layerOrder = [st.layers[0].id]; st.showSafeBounds = false; st.aspectRatio = "1:1";
        const L = st.layers[0];
        Object.assign(L, { shape: "square", width: 80, height: 80, offsetX: 0, offsetY: 0, rotation: 0, wireframe: false, color });
        L.structure.enabled = true; L.structure.mode = "repetition";
        Object.assign(L.structure.repetition, { cols: 2, rows: 2, gridType: "basic", showGridLines: false, checkerInvert: true });
        app.state = st; drawRaw(app);
        return cv.getContext("2d").getImageData(0, 0, cv.width, cv.height).data;
      };
      const dpr = cv.width / 600;
      const px = (d, x, y) => { const i = (Math.round(y * dpr) * cv.width + Math.round(x * dpr)) * 4; return [d[i], d[i + 1], d[i + 2]]; };
      // Cell (0,0) normal: module centre 150,150 in ink; cell (0,1) inverted: corner is ink, centre is the ground
      const d = render("#111111");
      const inv = px(d, 450, 150), invCorner = px(d, 310, 10);
      assert(inv[0] > 200, "Inverted cell: the module should show in the ground colour");
      assert(invCorner[0] < 60, "Inverted cell: the cell should be filled with the module colour");
      const red = render("#cc2222");
      const rc = px(red, 310, 10);
      assert(rc[0] > 150 && rc[1] < 80, "A coloured module should fill the inverted cell with its colour");
      reset();
    });


    const failed = results.filter(r => !r.ok).length;
    summary.textContent = failed === 0 ? `All ${results.length} tests passed` : `${failed} of ${results.length} tests FAILED`;
    summary.className = failed === 0 ? "pass" : "fail";
    document.title = (failed === 0 ? "PASS" : "FAIL") + " — Module Studio smoke tests";
    window.__smokeResult = { total: results.length, failed, results };
  }

  document.getElementById("run").addEventListener("click", () => runAll());
  frame.addEventListener("load", () => runAll().catch(e => { summary.textContent = e.message; summary.className = "fail"; }));
})();
</script>
